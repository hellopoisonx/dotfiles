<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  User fontconfig for hpxx-arch.
  Target: 14" 3K (3072x1920) panel at 1.65x scale, KDE Plasma 6 / Wayland.
  Strategy: append CJK + mono-CJK to the system fallback chain instead of
  replacing it, so per-app explicit font picks still win.

  Render: slight hinting + subpixel LCD legacy filter for crisp Latin at
  small sizes on the 3K panel. Hinting is disabled for CJK glyphs because
  rasterising thousands of strokes through autohinter only muddies them.

  Note: the rendering options below (antialias / hinting / rgba /
  lcdfilter) only affect XWayland / X11 clients. KWin and the native
  Qt/GTK Wayland backends do their own subpixel + AA at the compositor
  layer, so we deliberately do NOT set a hard DPI here. KDE's 1.65x
  scale factor already conveys density to native apps; pinning dpi in
  fontconfig would only desync XWayland window sizes.
-->
<fontconfig>

  <!-- Default rendering options. hintstyle=slight is the sweet spot for
       1.65x-scaled Latin on this panel; full hinting is too rigid,
       none is too blurry at UI sizes. XWayland-only effect.
       fontconfig 2.18 requires the lcdlegacy/lcdlight/lcdnone prefixed
       form; the bare 'legacy' constant is rejected with a warning. -->
  <match target="pattern">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting"   mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba"      mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdlegacy</const></edit>
  </match>

  <!-- CJK: skip hinting regardless of the default above. -->
  <match target="font">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <edit name="hinting"   mode="assign"><bool>false</bool></edit>
    <edit name="autohint"  mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>none</const></edit>
  </match>

  <!-- Default families. Each list is consumed in order; the first family
       that has a requested glyph wins. Latin stays in its primary family,
       while missing CJK glyphs fall through to Noto CJK and Emoji to
       Twemoji. -->

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK KR</family>
      <family>Twemoji</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif CJK SC</family>
      <family>Noto Serif CJK TC</family>
      <family>Noto Serif CJK JP</family>
      <family>Noto Serif CJK KR</family>
      <family>Twemoji</family>
    </prefer>
  </alias>

  <!--
    Monospace chain:
    1. CaskaydiaCove Nerd Font Mono: Cascadia Code with fixed-width Nerd
       Font glyphs for prompts, tmux, btop, lazygit, and editor icons.
    2. Noto Sans Mono CJK: CJK fallback for terminal and code comments.
    3. Twemoji / Noto Sans Mono: Emoji and final glyph fallback.
  -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>CaskaydiaCove Nerd Font Mono</family>
      <family>Noto Sans Mono CJK SC</family>
      <family>Noto Sans Mono CJK TC</family>
      <family>Noto Sans Mono CJK JP</family>
      <family>Noto Sans Mono CJK KR</family>
      <family>Twemoji</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <!-- Bind Cascadia strongly: the desktop zh-CN locale would otherwise
       make fontconfig choose the CJK fallback even for Latin glyphs. -->
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>CaskaydiaCove Nerd Font Mono</string>
    </edit>
  </match>

  <alias>
    <family>emoji</family>
    <prefer><family>Twemoji</family></prefer>
  </alias>

  <!--
    Some apps request these ad-hoc family names; redirect them into the
    generic chains above so CJK fallback still works.
  -->
  <alias>
    <family>ui-sans-serif</family>
    <prefer><family>sans-serif</family></prefer>
  </alias>
  <alias>
    <family>ui-monospace</family>
    <prefer><family>monospace</family></prefer>
  </alias>
  <alias>
    <family>ui-serif</family>
    <prefer><family>serif</family></prefer>
  </alias>

  <!--
    Most apps pick a single family + style and let fontconfig fill missing
    glyphs. These <match> rules append our preferred CJK families to the
    end of any "sans-serif" / "serif" / "monospace" request so even apps
    that set a hardcoded family still get CJK coverage.
  -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append_last">
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans CJK TC</string>
      <string>Noto Sans CJK JP</string>
      <string>Noto Sans CJK KR</string>
      <string>Twemoji</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="append_last">
      <string>Noto Serif CJK SC</string>
      <string>Noto Serif CJK TC</string>
      <string>Noto Serif CJK JP</string>
      <string>Noto Serif CJK KR</string>
      <string>Twemoji</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="append_last">
      <string>CaskaydiaCove Nerd Font Mono</string>
      <string>Noto Sans Mono CJK SC</string>
      <string>Noto Sans Mono CJK TC</string>
      <string>Noto Sans Mono CJK JP</string>
      <string>Noto Sans Mono CJK KR</string>
      <string>Twemoji</string>
    </edit>
  </match>

  <!--
    Prefer scalable outlines everywhere; Noto CJK ships no bitmap
    strikes, but WQY / 文鼎 still do; forcing outlines keeps the
    3K panel clean at any size.
  -->
  <match target="font">
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>

</fontconfig>
