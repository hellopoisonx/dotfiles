# Honor the shared Fontconfig monospace chain: CaskaydiaCove Nerd Font Mono
# first, then Noto CJK and Twemoji fallbacks.
font_family      monospace
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 16
disable_ligatures never

# Render Nerd Font private-use icons with the primary mono face and hold them
# to one terminal cell. This prevents fallback-font size and glyph mismatches.
symbol_map U+E000-U+F8FF,U+F0001-U+F1AF0 CaskaydiaCove Nerd Font Mono
narrow_symbols U+E000-U+F8FF,U+F0001-U+F1AF0 1
auto_reload_config 0.5

# --- background ---
background_opacity 1
background_blur 64

# Let shells report CWD changes (default is enabled, explicit for clarity)
shell_integration enabled

map ctrl+|         launch --location=vsplit --cwd=current
map ctrl+-         launch --location=hsplit --cwd=current
# Use the splits layout by default so launch --location=hsplit/vsplit
# actually controls vertical/horizontal splitting.
enabled_layouts splits

# --- window splits ---

# Ctrl + Shift + W  close the active window
map ctrl+shift+w   close_window

# Ctrl + Alt + h/j/k/l  move focus between split windows
map ctrl+shift+h     neighboring_window left
map ctrl+shift+j     neighboring_window down
map ctrl+shift+k     neighboring_window up
map ctrl+shift+l     neighboring_window right


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
